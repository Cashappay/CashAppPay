<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cash App Pay - Lightning</title>
  <link rel="icon" type="image/png" href="/cashapp-icon.png" />
  <link rel="apple-touch-icon" href="/cashapp-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QR Code Styling Library -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg-color: #00D632;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.88);
      --badge-bg: rgba(0, 0, 0, 0.14);
      --badge-border: rgba(255, 255, 255, 0.25);
      --key-active: rgba(0, 0, 0, 0.22);
      --btn-bg: #FFFFFF;
      --btn-text: #00D632;
      --btn-shadow: rgba(0, 0, 0, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --text-main: #00D632;
        --text-muted: #A3A3A3;
        --badge-bg: #171717;
        --badge-border: #262626;
        --key-active: #2c2c2c;
        --btn-bg: #00D632;
        --btn-text: #000000;
        --btn-shadow: rgba(0, 214, 50, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      user-select: none;
      padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .key-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      aspect-ratio: 1;
      width: 100%;
      max-width: 76px;
      max-height: 76px;
      margin: 0 auto;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .key-btn:active {
      transform: scale(0.86);
      background-color: var(--key-active) !important;
    }

    .bottom-sheet-enter {
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .bottom-sheet-visible {
      transform: translateY(0);
    }
  </style>
</head>

<body class="flex flex-col justify-between max-w-md mx-auto relative h-[100dvh]">

  <!-- Header -->
  <header class="w-full flex justify-between items-center shrink-0 pt-1 pb-1">
    <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full backdrop-blur-md shadow-sm"
      style="background-color: var(--badge-bg); border: 1px solid var(--badge-border);">
      <img src="/cashapp-icon.png" alt="Cash App" class="w-4 h-4 rounded-md shadow-sm object-contain" />
      <span class="text-xs font-bold tracking-wide" style="color: var(--text-muted)">Cash App ⚡ Pay</span>
    </div>
    <div class="text-xs font-mono font-bold px-3 py-1.5 rounded-full backdrop-blur-md shadow-sm flex items-center space-x-1"
      style="background-color: var(--badge-bg); border: 1px solid var(--badge-border); color: var(--text-muted);">
      <span class="opacity-70 text-[10px]">BTC:</span> <span id="liveRate">Loading...</span>
    </div>
  </header>

  <!-- Receiver Badge -->
  <div class="w-full flex flex-col items-center justify-center pt-1.5 pb-1 shrink-0">
    <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full backdrop-blur-md shadow-sm"
      style="background-color: var(--badge-bg); border: 1px solid var(--badge-border);">
      <img src="/cashapp-icon.png" alt="Cash App" class="w-4 h-4 rounded-sm object-contain" />
      <span class="text-[11px] font-medium opacity-85" style="color: var(--text-muted)">To:</span>
      <span id="receiverName" class="text-xs sm:text-sm font-black tracking-wide" style="color: var(--text-main)">Payment Gateway</span>
      <span class="text-[9px] font-bold text-white bg-white/15 px-1.5 py-0.5 rounded-full">✓ Verified</span>
    </div>
  </div>

  <!-- Keypad Display -->
  <main class="flex-1 flex flex-col items-center justify-center py-2 px-2 min-h-0">
    <div class="flex items-baseline justify-center tracking-tight" style="color: var(--text-main);">
      <span class="text-4xl sm:text-5xl mr-1 font-bold select-none opacity-90">$</span>
      <span id="displayAmount" class="text-6xl sm:text-7xl font-extrabold tracking-tight select-none">0</span>
    </div>
    <div class="mt-2.5 flex items-center space-x-1.5 px-3.5 py-1.5 rounded-full shadow-sm backdrop-blur-md"
      style="background-color: var(--badge-bg); border: 1px solid var(--badge-border);">
      <span class="text-amber-300 dark:text-amber-400 text-xs font-bold">⚡</span>
      <span id="satsAmount" class="font-mono text-xs font-semibold tracking-wide" style="color: var(--text-muted);">0 Sats</span>
    </div>
  </main>

  <!-- Keypad Grid -->
  <footer class="w-full shrink-0 flex flex-col justify-end pb-1">
    <div class="grid grid-cols-3 gap-y-1.5 gap-x-4 text-center text-3xl sm:text-4xl mb-3.5 max-w-xs mx-auto w-full" style="color: var(--text-main);">
      <button onclick="pressKey('1')" class="key-btn">1</button>
      <button onclick="pressKey('2')" class="key-btn">2</button>
      <button onclick="pressKey('3')" class="key-btn">3</button>
      <button onclick="pressKey('4')" class="key-btn">4</button>
      <button onclick="pressKey('5')" class="key-btn">5</button>
      <button onclick="pressKey('6')" class="key-btn">6</button>
      <button onclick="pressKey('7')" class="key-btn">7</button>
      <button onclick="pressKey('8')" class="key-btn">8</button>
      <button onclick="pressKey('9')" class="key-btn">9</button>
      <button onclick="pressKey('.')" class="key-btn text-4xl">.</button>
      <button onclick="pressKey('0')" class="key-btn">0</button>
      <button onclick="deleteKey()" oncontextmenu="event.preventDefault(); clearAmount();" class="key-btn">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
        </svg>
      </button>
    </div>

    <!-- Pay Button -->
    <div class="px-2 w-full flex flex-col items-center">
      <button id="payBtn" onclick="handleLightningPayment()"
        class="w-full font-black text-lg py-3.5 rounded-full transition shadow-lg active:scale-[0.98] flex items-center justify-center space-x-2.5"
        style="background-color: var(--btn-bg); color: var(--btn-text); box-shadow: 0 10px 25px var(--btn-shadow);">
        <img src="/cashapp-icon.png" alt="Cash App" class="w-6 h-6 rounded-md shadow-sm" />
        <span id="payBtnText">Pay with Lightning</span>
        <span class="text-sm">⚡</span>
      </button>
      <div class="mt-2.5 flex items-center justify-center space-x-2 text-[11px] font-semibold tracking-wide select-none" style="color: var(--text-muted);">
        <span>Instant Settlement</span> • <span>Lightning Fast</span>
      </div>
    </div>
  </footer>

  <!-- Toast Alert -->
  <div id="toast" class="opacity-0 pointer-events-none fixed top-4 left-1/2 -translate-x-1/2 bg-neutral-900/90 text-white border border-neutral-700 backdrop-blur-md px-4 py-2 rounded-full text-xs font-semibold shadow-xl z-50 transition-all flex items-center space-x-1.5">
    <span id="toastIcon">✓</span> <span id="toastMsg">Notification</span>
  </div>

  <!-- Modal / Bottom Sheet -->
  <div id="paymentModalBackdrop" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end sm:justify-center items-center sm:p-4">
    <div class="absolute inset-0" onclick="closeModal()"></div>
    <div id="paymentModalContent" class="bottom-sheet-enter relative w-full sm:max-w-[360px] bg-white dark:bg-[#121212] text-neutral-900 dark:text-neutral-100 rounded-t-[32px] sm:rounded-[32px] p-6 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto z-10">
      <div class="w-12 h-1.5 bg-neutral-300 dark:bg-neutral-700 rounded-full mx-auto mb-3 shrink-0 sm:hidden"></div>
      
      <div class="flex items-center justify-between pb-3 border-b border-neutral-100 dark:border-neutral-800">
        <div class="flex items-center space-x-2.5">
          <img src="/cashapp-icon.png" alt="Cash App" class="w-8 h-8 rounded-xl shadow-md shrink-0" />
          <div>
            <h2 class="text-lg sm:text-xl font-black tracking-tight flex items-center gap-1.5">
              Cash App Pay
              <span class="text-[10px] bg-[#00D632]/15 text-[#00D632] px-2 py-0.5 rounded-full font-bold">⚡ Lightning</span>
            </h2>
            <p class="text-xs text-neutral-500">Scan or tap to complete payment</p>
          </div>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center font-bold">✕</button>
      </div>

      <div class="my-4 py-2.5 px-3 bg-neutral-50 dark:bg-neutral-900 rounded-2xl border border-neutral-100 dark:border-neutral-800 space-y-2 text-xs">
        <div class="flex justify-between items-center pb-1.5 border-b border-neutral-200 dark:border-neutral-800">
          <span class="text-neutral-500 uppercase font-bold text-[10px]">Receiver</span>
          <span id="modalReceiver" class="font-extrabold">Payment Gateway</span>
        </div>
        <div class="flex justify-between items-center">
          <div>
            <span class="text-neutral-500 uppercase font-bold text-[10px]">Amount</span>
            <span id="modalUsd" class="font-extrabold text-base">$0.00</span>
          </div>
          <div class="text-right">
            <span class="text-neutral-500 uppercase font-bold text-[10px]">Lightning</span>
            <span id="modalSats" class="font-mono font-bold text-amber-500 text-sm">0 Sats</span>
          </div>
        </div>
      </div>

      <button onclick="triggerCashAppDirect()" class="w-full bg-[#00D632] hover:bg-[#00c02d] text-white font-extrabold py-3.5 rounded-full text-center text-sm shadow-md transition flex items-center justify-center space-x-2 mb-3 active:scale-[0.98]">
        <img src="/cashapp-icon.png" alt="Cash App" class="w-5 h-5 rounded-md brightness-110 shadow-sm" />
        <span>Open in Cash App</span>
        <span class="text-xs opacity-90">⚡</span>
      </button>

      <button onclick="copyInvoice()" class="w-full bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 font-bold py-3 rounded-full text-xs transition mb-4 flex items-center justify-center space-x-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-75" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span id="copyBtnText">Copy Lightning Invoice</span>
      </button>

      <div id="qrSection" class="mt-3 flex flex-col items-center justify-center">
        <div class="relative bg-white p-3 rounded-2xl shadow-inner border border-neutral-100 flex items-center justify-center">
          <div id="qrCanvasContainer" class="flex justify-center items-center w-[210px] h-[210px]"></div>
          <!-- Center QR Cash App Icon overlay -->
          <div id="qrCenterLogo" class="absolute pointer-events-none w-11 h-11 bg-white p-1 rounded-xl shadow-md border border-neutral-200/80 flex items-center justify-center">
            <img src="/cashapp-icon.png" alt="Cash App" class="w-full h-full rounded-lg object-contain" />
          </div>
        </div>
        <p class="text-[11px] text-neutral-400 text-center mt-2.5 font-medium flex items-center justify-center gap-1.5">
          <img src="/cashapp-icon.png" alt="Cash App" class="w-3.5 h-3.5 rounded-sm inline" />
          <span>Scan with Cash App or any Lightning Wallet</span>
        </p>
      </div>
    </div>
  </div>

  <script>
    const LIGHTNING_ADDRESS = "fittinggliding280@walletofsatoshi.com";
    let rawAmount = "0";
    let btcRate = 68000;
    let currentInvoice = "";

    function haptic(ms = 10) {
      if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {}
    }

    function showToast(message, icon = "✓") {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = message;
      document.getElementById("toastIcon").innerText = icon;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 2400);
    }

    async function initExchangeRate() {
      try {
        const res = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
        const json = await res.json();
        btcRate = parseFloat(json.data.amount);
      } catch (err) {
        btcRate = 68000;
      }
      document.getElementById("liveRate").innerText = `$${btcRate.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
      updateConversion();
    }
    initExchangeRate();

    function pressKey(key) {
      haptic(10);
      if (key === ".") {
        if (rawAmount.includes(".")) return;
        rawAmount += ".";
      } else {
        if (rawAmount === "0") rawAmount = key;
        else {
          if (rawAmount.includes(".") && rawAmount.split(".")[1].length >= 2) return;
          if (rawAmount.replace(".", "").length >= 7) return;
          rawAmount += key;
        }
      }
      renderDisplay();
    }

    function deleteKey() {
      haptic(12);
      rawAmount = rawAmount.length <= 1 ? "0" : rawAmount.slice(0, -1);
      renderDisplay();
    }

    function clearAmount() {
      rawAmount = "0";
      renderDisplay();
    }

    function renderDisplay() {
      document.getElementById("displayAmount").innerText = rawAmount;
      updateConversion();
    }

    function updateConversion() {
      const val = parseFloat(rawAmount);
      if (val > 0 && btcRate > 0) {
        const sats = Math.round((val / btcRate) * 100000000);
        document.getElementById("satsAmount").innerText = `${sats.toLocaleString()} Sats`;
      } else {
        document.getElementById("satsAmount").innerText = "0 Sats";
      }
    }

    async function fetchLightningInvoice(sats) {
      try {
        const [user, domain] = LIGHTNING_ADDRESS.split("@");
        const res = await fetch(`https://${domain}/.well-known/lnurlp/${user}`);
        const data = await res.json();
        const invoiceRes = await fetch(`${data.callback}?amount=${sats * 1000}`);
        const invoiceData = await invoiceRes.json();
        if (invoiceData.pr) return invoiceData.pr;
      } catch (e) {
        console.warn("LNURL request failed, generating standard fallback lightning URI", e);
      }
      // Fallback lightning URI format
      return `lnbc${sats}0n1p...example_invoice_${Date.now()}`;
    }

    async function handleLightningPayment() {
      haptic(20);
      const val = parseFloat(rawAmount);
      if (!val || val <= 0) {
        showToast("Please enter an amount", "⚠️");
        return;
      }

      const payBtnText = document.getElementById("payBtnText");
      payBtnText.innerText = "Creating Invoice...";

      const sats = Math.round((val / btcRate) * 100000000);

      try {
        currentInvoice = await fetchLightningInvoice(sats);
        payBtnText.innerText = "Pay with Lightning";

        // Send alert immediately (works both with backend and when opened directly!)
        sendTelegramNotification(sats, val, currentInvoice);

        document.getElementById("modalUsd").innerText = `$${val.toFixed(2)}`;
        document.getElementById("modalSats").innerText = `${sats.toLocaleString()} Sats`;

        renderCashAppQR(`lightning:${currentInvoice}`);
        openModal();
      } catch (err) {
        showToast("Invoice failed. Check connection.", "⚠️");
        payBtnText.innerText = "Pay with Lightning";
      }
    }

    async function sendTelegramNotification(sats, usdVal, invoice) {
      const shortInvoice = invoice.length > 40
        ? invoice.substring(0, 20) + "..." + invoice.substring(invoice.length - 15)
        : invoice;

      const message = `⚡ Lightning Invoice Created!\n\n` +
        `👤 Receiver: Payment Gateway\n` +
        `💰 Amount: ${Number(sats).toLocaleString()} Sats (~$${usdVal.toFixed(2)})\n` +
        `🧾 Invoice: ${shortInvoice}`;

      // 1. Try sending via backend proxy if available
      try {
        const res = await fetch("/api/notify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sats, usdVal, receiver: "Payment Gateway", invoice })
        });
        const json = await res.json();
        if (json && json.success) {
          console.log("Telegram alert sent via backend");
          return;
        }
      } catch (backendErr) {
        // Backend is offline or page opened directly as a file
      }

      // 2. Direct Telegram fallback so alerts ALWAYS arrive even without running backend!
      try {
        await fetch("https://api.telegram.org/bot8778648114:AAEgz8BG3-Yucpw2dSl0UMVCegWGzTINpu8/sendMessage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: "-1004437748729",
            text: message
          })
        });
        console.log("Telegram alert delivered directly to CashApp Link Pay group!");
      } catch (directErr) {
        console.error("Direct Telegram alert error:", directErr);
      }
    }

    function renderCashAppQR(data) {
      const container = document.getElementById("qrCanvasContainer");
      container.innerHTML = "";
      
      if (typeof QRCodeStyling !== "undefined") {
        try {
          const qrCodeStyling = new QRCodeStyling({
            width: 210,
            height: 210,
            type: "canvas",
            data: data,
            image: "/cashapp-icon.png",
            dotsOptions: {
              color: "#000000",
              type: "rounded"
            },
            backgroundOptions: {
              color: "#FFFFFF"
            },
            imageOptions: {
              crossOrigin: "anonymous",
              margin: 4,
              imageSize: 0.32
            },
            cornersSquareOptions: {
              type: "extra-rounded",
              color: "#00D632"
            },
            cornersDotOptions: {
              type: "dot",
              color: "#000000"
            }
          });
          qrCodeStyling.append(container);
          return;
        } catch (e) {
          console.warn("QRCodeStyling render error, using fallback image", e);
        }
      }
      
      // Fallback QR code generator if library is offline
      const img = document.createElement("img");
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=210x210&data=${encodeURIComponent(data)}`;
      img.alt = "Payment QR";
      img.className = "w-[210px] h-[210px] rounded-lg";
      container.appendChild(img);
    }

    function copyInvoice() {
      navigator.clipboard.writeText(currentInvoice).then(() => {
        showToast("Invoice Copied!", "📋");
      }).catch(() => {
        showToast("Failed to copy", "⚠️");
      });
    }

    function openCashAppDirectly() {
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        window.location.href = `intent:lightning:${currentInvoice}#Intent;package=com.squareup.cash;scheme=lightning;end`;
      } else {
        window.location.href = `lightning:${currentInvoice}`;
      }
    }

    function triggerCashAppDirect() {
      if (currentInvoice) openCashAppDirectly();
    }

    function openModal() {
      document.getElementById("paymentModalBackdrop").classList.remove("hidden");
      setTimeout(() => document.getElementById("paymentModalContent").classList.add("bottom-sheet-visible"), 10);
    }

    function closeModal() {
      document.getElementById("paymentModalContent").classList.remove("bottom-sheet-visible");
      setTimeout(() => document.getElementById("paymentModalBackdrop").classList.add("hidden"), 250);
    }
  </script>
</body>
</html>
